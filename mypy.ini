[mypy]
python_version = 3.12
explicit_package_bases = True
namespace_packages = True
mypy_path = .

# Exclude virtual environments from analysis.
exclude = (?x)(^runtime/\.venv/|^\.venv/)

# Diagnostics and output
show_error_codes = True
pretty = True
warn_unused_configs = True
warn_unused_ignores = False
warn_redundant_casts = True
warn_no_return = True

# Gradual typing strategy
strict = False
disallow_untyped_defs = False
check_untyped_defs = True
no_implicit_optional = True
ignore_missing_imports = True

# TODO(typing-hardening, owner=team, target=2026-05): Re-enable once legacy `# type: ignore` cleanup is complete.
# warn_unused_ignores = True
# TODO(typing-hardening, owner=team, target=2026-06): Enable strict untyped-def checks incrementally per module, e.g.:
# [mypy-runtime.assessment_orchestration.*]
# disallow_untyped_defs = True

# These modules use try/except ModuleNotFoundError for dual-path imports
# (runtime.X vs bare X inside the container). Both paths resolve under
# explicit_package_bases=True so mypy fires no-redef on each except branch.
[mypy-runtime.log_config]
disable_error_code = no-redef

[mypy-runtime.outbound_instrumentation]
disable_error_code = no-redef

[mypy-runtime.ingestion.*]
disable_error_code = no-redef
