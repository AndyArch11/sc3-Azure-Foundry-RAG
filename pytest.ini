[pytest]
markers =
    sample_fixtures: tests that rely on local sample files under runtime/samples
    integration: tests that validate deployed services and may call live Azure endpoints
    private_network: tests intended to run only from private network locations (jumpbox or private-network-connected runner)
    confluence_live: tests that call the real Confluence Cloud API; set CONFLUENCE_LIVE_RUN=1 and required Confluence auth env vars to execute
