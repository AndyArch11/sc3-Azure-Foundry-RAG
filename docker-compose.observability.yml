services:
  loki:
    image: grafana/loki:3.1.1
    container_name: rag-loki-local
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    entrypoint:
      - /bin/sh
      - -lc
      - |
        cat >/tmp/loki.local.yml <<'YAML'
        auth_enabled: false

        server:
          http_listen_port: 3100

        common:
          path_prefix: /loki
          replication_factor: 1
          ring:
            kvstore:
              store: inmemory
          storage:
            filesystem:
              chunks_directory: /loki/chunks
              rules_directory: /loki/rules

        schema_config:
          configs:
            - from: 2024-01-01
              store: tsdb
              object_store: filesystem
              schema: v13
              index:
                prefix: index_
                period: 24h

        limits_config:
          reject_old_samples: true
          reject_old_samples_max_age: 168h
          # TODO: Loki 3.x still emits JSONParserErr on plain Uvicorn access lines despite
          # these flags. Investigate Promtail drop stage for non-JSON lines or a per-stream
          # Loki structured-metadata override as the correct long-term fix.
          discover_log_levels: false
          allow_structured_metadata: false

        analytics:
          reporting_enabled: false
        YAML
        exec /usr/bin/loki -config.file=/tmp/loki.local.yml

  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: rag-prometheus-local
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9090:9090"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        cat >/tmp/prometheus.local.yml <<'YAML'
        global:
          scrape_interval: 15s
          evaluation_interval: 15s

        alerting:
          alertmanagers:
            - static_configs:
                - targets:
                    - alertmanager:9093

        rule_files:
          - /tmp/alerts.local.yml

        scrape_configs:
          - job_name: query-web
            metrics_path: /metrics
            static_configs:
              - targets:
                  - query-web:8080
        YAML
        cat >/tmp/alerts.local.yml <<'YAML'
        groups:
          - name: query-web-latency
            rules:
              - alert: QueryWebHighP95Latency
                expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
                for: 10m
                labels:
                  severity: warning
                  service: query-web
                annotations:
                  summary: Query web p95 latency is elevated
                  description: p95 latency is above 1 second for 10 minutes.

              - alert: QueryWebHighP99Latency
                expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
                for: 10m
                labels:
                  severity: critical
                  service: query-web
                annotations:
                  summary: Query web p99 latency is elevated
                  description: p99 latency is above 2 seconds for 10 minutes.

          - name: query-web-trace-hygiene
            rules:
              - alert: QueryWebTraceparentDropSpike
                expr: sum(rate(trace_traceparent_dropped_total[5m])) > 0.1
                for: 5m
                labels:
                  severity: warning
                  service: query-web
                annotations:
                  summary: Traceparent drop rate is elevated
                  description: Dropped traceparent headers are above 0.1 per second for 5 minutes.

              - alert: QueryWebCorrelationIdSanitisationSpike
                expr: rate(trace_correlation_id_sanitised_total[5m]) > 0.05
                for: 5m
                labels:
                  severity: warning
                  service: query-web
                annotations:
                  summary: Correlation ID sanitisation rate is elevated
                  description: Sanitised correlation IDs are above 0.05 per second for 5 minutes.

          - name: query-web-scrape-health
            rules:
              - alert: QueryWebTargetDown
                expr: up{job="query-web"} == 0
                for: 2m
                labels:
                  severity: critical
                  service: query-web
                annotations:
                  summary: Query web metrics target is down
                  description: Prometheus cannot scrape the query-web target for more than 2 minutes.

              - alert: QueryWebNoTraffic
                expr: sum(increase(http_request_duration_seconds_count{path!="/metrics"}[10m])) == 0
                for: 10m
                labels:
                  severity: warning
                  service: query-web
                annotations:
                  summary: Query web has no inbound traffic
                  description: No non-metrics HTTP requests were observed for 10 minutes while scrape remains healthy.
        YAML
        exec /bin/prometheus --config.file=/tmp/prometheus.local.yml --storage.tsdb.retention.time=7d --web.enable-lifecycle

  grafana:
    image: grafana/grafana:11.2.2
    container_name: rag-grafana-local
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_USERS_DEFAULT_THEME: "light"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        mkdir -p /etc/grafana/provisioning/datasources \
                 /etc/grafana/provisioning/dashboards \
                 /var/lib/grafana/dashboards
        cat >/etc/grafana/provisioning/datasources/prometheus.yml <<'YAML'
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            editable: false
        YAML
        cat >/etc/grafana/provisioning/datasources/loki.yml <<'YAML'
        apiVersion: 1
        datasources:
          - name: Loki
            type: loki
            uid: loki
            access: proxy
            url: http://loki:3100
            editable: false
        YAML
        cat >/etc/grafana/provisioning/dashboards/dashboards.yml <<'YAML'
        apiVersion: 1
        providers:
          - name: query-web-local
            orgId: 1
            folder: "Query Web"
            type: file
            disableDeletion: false
            updateIntervalSeconds: 15
            options:
              path: /var/lib/grafana/dashboards
        YAML
        cat >/var/lib/grafana/dashboards/query-web-local-observability.json <<'ENDJSON'
        {
          "annotations": {"list": [{"builtIn": 1,"datasource": {"type": "grafana","uid": "-- Grafana --"},"enable": true,"hide": true,"iconColor": "rgba(0, 211, 255, 1)","name": "Annotations & Alerts","target": {"limit": 100,"matchAny": false,"tags": [],"type": "dashboard"},"type": "dashboard"}]},
          "editable": true,
          "fiscalYearStartMonth": 0,
          "graphTooltip": 0,
          "id": null,
          "links": [],
          "panels": [
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "thresholds"},"decimals": 2,"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "orange","value": 0.5},{"color": "red","value": 1}]},"unit": "s"},"overrides": []},"gridPos": {"h": 8,"w": 8,"x": 0,"y": 0},"id": 1,"options": {"colorMode": "background","graphMode": "none","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m])))","legendFormat": "p95","range": true,"refId": "A"}],"title": "HTTP Latency p95 (5m)","type": "stat"},
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "red","value": 5}]},"unit": "reqps"},"overrides": []},"gridPos": {"h": 8,"w": 8,"x": 8,"y": 0},"id": 2,"options": {"colorMode": "value","graphMode": "area","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "sum(rate(http_request_duration_seconds_count[5m]))","legendFormat": "requests/s","range": true,"refId": "A"}],"title": "HTTP Request Rate (5m)","type": "stat"},
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "red","value": 0.1}]},"unit": "ops"},"overrides": []},"gridPos": {"h": 8,"w": 8,"x": 16,"y": 0},"id": 3,"options": {"colorMode": "value","graphMode": "line","justifyMode": "auto","orientation": "auto","reduceOptions": {"calcs": ["lastNotNull"],"fields": "","values": false},"textMode": "auto"},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "sum(rate(trace_traceparent_dropped_total[5m]))","legendFormat": "drops/s","range": true,"refId": "A"}],"title": "Traceparent Drops Rate (5m)","type": "stat"},
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "orange","value": 0.25},{"color": "red","value": 0.5}]},"unit": "s"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 0,"y": 8},"id": 4,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "single","sort": "none"}},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "histogram_quantile(0.5, sum by (le, method, path, status) (rate(http_request_duration_seconds_bucket[5m])))","legendFormat": "p50 {{method}} {{path}} {{status}}","range": true,"refId": "A"},{"editorMode": "code","expr": "histogram_quantile(0.95, sum by (le, method, path, status) (rate(http_request_duration_seconds_bucket[5m])))","legendFormat": "p95 {{method}} {{path}} {{status}}","range": true,"refId": "B"},{"editorMode": "code","expr": "histogram_quantile(0.99, sum by (le, method, path, status) (rate(http_request_duration_seconds_bucket[5m])))","legendFormat": "p99 {{method}} {{path}} {{status}}","range": true,"refId": "C"}],"title": "Latency by Route and Status","type": "timeseries"},
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "orange","value": 0.1},{"color": "red","value": 0.25}]},"unit": "ops"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 12,"y": 8},"id": 5,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "single","sort": "none"}},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "sum by (reason) (rate(trace_traceparent_dropped_total[5m]))","legendFormat": "drop {{reason}}","range": true,"refId": "A"},{"editorMode": "code","expr": "rate(trace_traceparent_salvaged_total[5m])","legendFormat": "salvaged","range": true,"refId": "B"},{"editorMode": "code","expr": "rate(trace_correlation_id_sanitised_total[5m])","legendFormat": "correlation id sanitised","range": true,"refId": "C"}],"title": "Trace and Correlation Hygiene Rates","type": "timeseries"},
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "orange","value": 0.01},{"color": "red","value": 0.05}]},"unit": "percentunit"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 0,"y": 16},"id": 6,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "single","sort": "none"}},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "sum(rate(http_request_duration_seconds_count{status=~\"5..\"}[5m])) / clamp_min(sum(rate(http_request_duration_seconds_count[5m])), 1e-9)","legendFormat": "5xx error ratio","range": true,"refId": "A"}],"title": "HTTP Error Rate (5xx ratio)","type": "timeseries"},
            {"datasource": {"type": "prometheus","uid": "prometheus"},"fieldConfig": {"defaults": {"color": {"mode": "palette-classic"},"mappings": [],"thresholds": {"mode": "absolute","steps": [{"color": "green","value": null},{"color": "orange","value": 5},{"color": "red","value": 20}]},"unit": "short"},"overrides": []},"gridPos": {"h": 8,"w": 12,"x": 12,"y": 16},"id": 7,"options": {"legend": {"calcs": [],"displayMode": "list","placement": "bottom","showLegend": true},"tooltip": {"mode": "single","sort": "none"}},"pluginVersion": "11.2.2","targets": [{"editorMode": "code","expr": "increase(trace_correlation_id_sanitised_total[5m])","legendFormat": "sanitised in 5m","range": true,"refId": "A"}],"title": "Correlation ID Sanitisation Trend (increase/5m)","type": "timeseries"},
            {"datasource": {"type": "loki","uid": "loki"},"gridPos": {"h": 10,"w": 24,"x": 0,"y": 24},"id": 8,"options": {"dedupStrategy": "none","enableLogDetails": true,"prettifyLogMessage": false,"showCommonLabels": false,"showLabels": true,"showTime": true,"sortOrder": "Descending","wrapLogMessage": true},"pluginVersion": "11.2.2","targets": [{"datasource": {"type": "loki","uid": "loki"},"editorMode": "code","expr": "{service=\"query-web\"}","queryType": "range","refId": "A"}],"title": "Recent Query Web Logs","type": "logs"}
          ],
          "refresh": "15s",
          "schemaVersion": 39,
          "tags": ["local","query-web","prometheus"],
          "templating": {"list": []},
          "time": {"from": "now-1h","to": "now"},
          "timepicker": {},
          "timezone": "browser",
          "title": "Query Web Local Observability",
          "uid": "query-web-local-observability",
          "version": 1,
          "weekStart": ""
        }
        ENDJSON
        export PATH=/usr/share/grafana/bin:$PATH
        exec /run.sh grafana-server \
          --config /etc/grafana/grafana.ini \
          cfg:default.paths.data=/var/lib/grafana \
          cfg:default.paths.logs=/var/log/grafana \
          cfg:default.paths.plugins=/var/lib/grafana/plugins \
          cfg:default.paths.provisioning=/etc/grafana/provisioning

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: rag-alertmanager-local
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "9093:9093"
    entrypoint:
      - /bin/sh
      - -lc
      - |
        cat >/tmp/alertmanager.local.yml <<'YAML'
        global:
          resolve_timeout: 5m

        route:
          receiver: webhook-echo
          group_by: [alertname, severity]
          group_wait: 10s
          group_interval: 1m
          repeat_interval: 15m
          routes:
            - matchers:
                - severity="critical"
              receiver: webhook-echo
              group_wait: 5s
              repeat_interval: 5m

        receivers:
          - name: webhook-echo
            webhook_configs:
              - url: http://webhook-echo:8080/alert
                send_resolved: true

        inhibit_rules:
          - source_matchers:
              - severity="critical"
            target_matchers:
              - severity="warning"
            equal: [alertname]
        YAML
        exec /bin/alertmanager --config.file=/tmp/alertmanager.local.yml --storage.path=/alertmanager --log.level=info

  webhook-echo:
    image: mendhak/http-https-echo:33
    container_name: rag-webhook-echo-local
    restart: unless-stopped
    profiles: ["observability"]
    ports:
      - "8090:8080"
    environment:
      HTTP_PORT: "8080"

  promtail:
    image: grafana/promtail:3.1.1
    container_name: rag-promtail-local
    restart: unless-stopped
    profiles: ["observability"]
    depends_on:
      - loki
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    entrypoint:
      - /bin/sh
      - -lc
      - |
        cat >/tmp/promtail.local.yml <<'YAML'
        server:
          http_listen_port: 9080
          grpc_listen_port: 0

        positions:
          filename: /tmp/positions.yaml

        clients:
          - url: http://loki:3100/loki/api/v1/push

        scrape_configs:
          - job_name: local-python-stdout
            docker_sd_configs:
              - host: unix:///var/run/docker.sock
                refresh_interval: 5s
            relabel_configs:
              - source_labels: [__meta_docker_container_label_com_docker_compose_service]
                regex: (query-web|confluence-poller)
                action: keep
              - target_label: job
                replacement: local-python-stdout
              - source_labels: [__meta_docker_container_label_com_docker_compose_service]
                target_label: service
              - source_labels: [__meta_docker_container_name]
                regex: '/(.*)'
                target_label: container
                replacement: '$1'
              - source_labels: [__meta_docker_container_label_com_docker_compose_project]
                target_label: compose_project
            pipeline_stages:
              - docker: {}
              - static_labels:
                  source: docker
        YAML
        exec /usr/bin/promtail -config.file=/tmp/promtail.local.yml

volumes:
  loki_data:
