version: 1
contract_type: provider_event_contract
provider: confluence
event_types:
  - event_type: mention_notification
    purpose: Directed assessment request from page mention or comment mention.
    required_fields:
      - event_id
      - occurred_at
      - site_id
      - space_key
      - target_id
      - target_url
    normalised_output:
      source_type: provider_event
      provider: confluence
      trigger_type: mention
    example_event:
      event_id: conf-evt-1
      occurred_at: "2026-04-02T00:00:00Z"
      site_id: confluence-site
      space_key: SEC
      target_id: "1234"
      target_url: https://example.atlassian.net/wiki/spaces/SEC/pages/1234/Page+Title
  - event_type: page_updated
    purpose: Optional change-driven reassessment trigger for approved Confluence spaces.
    required_fields:
      - event_id
      - occurred_at
      - site_id
      - space_key
      - target_id
      - target_url
      - modified_by
    normalised_output:
      source_type: provider_event
      provider: confluence
      trigger_type: update
    example_event:
      event_id: conf-evt-2
      occurred_at: "2026-04-02T01:00:00Z"
      site_id: confluence-site
      space_key: SEC
      target_id: "1234"
      target_url: https://example.atlassian.net/wiki/spaces/SEC/pages/1234/Page+Title
      modified_by: editor@example.com
security_requirements:
  - validate provider source where webhook signatures or issuer validation are supported
  - route through approved ingress or relay for private deployments
  - preserve original event identifiers for deduplication
failure_modes:
  - unsupported_event_type
  - missing_target_reference
  - unverifiable_source
