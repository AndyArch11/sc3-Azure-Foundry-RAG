    ProviderStatusResponse:
      type: object
      properties:
        provider:
          type: string
        query_deployment:
          type: string
        embedding_deployment:
          type: string
        runtime_hints:
          type: object
          nullable: true
          description: |
            Optional advisory runtime metadata for client-side tuning and diagnostics.
            Values are informational, may be omitted, and can vary by deployment/model/provider.
          properties:
            context_window_tokens_hint:
              type: integer
              minimum: 1
              nullable: true
              description: |
                Advisory context-window estimate in tokens.
                Prefer model/provider capability metadata for hosted/cloud LLMs when available.
                For local/self-hosted deployments, this may be derived from runtime configuration.
            context_window_source:
              type: string
              nullable: true
              enum:
                - runtime_config
                - provider_runtime
                - model_metadata
                - unknown
              description: Source used to derive `context_window_tokens_hint`.
            max_completion_tokens_effective:
              type: integer
              minimum: 1
              nullable: true
              description: |
                Effective max completion token limit applied at runtime.
                This is the recommended primary token-budget signal for client request shaping.
            max_completion_tokens_source:
              type: string
              nullable: true
              enum:
                - request_override
                - thinking_mode_preset
                - provider_runtime
                - model_metadata
                - runtime_config
                - unknown
              description: Source used to derive `max_completion_tokens_effective`.
            evaluator_max_completion_tokens_effective:
              type: integer
              minimum: 1
              nullable: true
              description: Effective evaluator token limit applied at runtime.
            request_timeout_seconds_hint:
              type: integer
              minimum: 1
              nullable: true
              description: Advisory timeout hint for this request class.
            provider_constraints_note:
              type: string
              nullable: true
              description: Human-readable provider/model constraint summary when available.
          additionalProperties: true
      required:
        - provider
        - query_deployment
        - embedding_deployment
