version: 1
contract_type: mcp_tool_set
provider: confluence
supports_identity_modes:
  - app_only
  - delegated
normalised_objects:
  - space
  - page
  - comment
common_requirements:
  delegated_user_request_rule: User-requested assessment must execute with delegated identity and must fail closed if delegated context is missing.
  app_only_scope_rule: App-only access must be limited to approved spaces and content roots.
  idempotency_rule: Write operations must accept an external idempotency key.
tools:
  - tool_name: resolve_target
    purpose: Resolve a Confluence URL or content reference into a canonical page target.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      required:
        - target_reference
      properties:
        target_reference:
          type: string
    output_schema:
      type: object
      required:
        - provider
        - target_type
        - target_id
        - canonical_url
        - title
        - space_key
      properties:
        provider:
          const: confluence
        target_type:
          const: page
        target_id:
          type: string
        canonical_url:
          type: string
        title:
          type: string
        space_key:
          type: string
    failure_modes:
      - invalid_url
      - target_not_found
      - unsupported_target_type
    example_input:
      target_reference: https://example.atlassian.net/wiki/spaces/SEC/pages/1234/Page+Title
    example_output:
      provider: confluence
      target_type: page
      target_id: "1234"
      canonical_url: https://example.atlassian.net/wiki/spaces/SEC/pages/1234/Page+Title
      title: Page Title
      space_key: SEC

  - tool_name: check_user_access
    purpose: Verify the requesting user can access the Confluence page.
    allowed_identity_modes:
      - delegated
    input_schema:
      type: object
      required:
        - target_id
        - delegated_user_context
      properties:
        target_id:
          type: string
        delegated_user_context:
          type: object
    output_schema:
      type: object
      required:
        - granted
        - effective_identity_mode
        - reason
      properties:
        granted:
          type: boolean
        effective_identity_mode:
          const: delegated
        reason:
          type: string
    failure_modes:
      - delegated_context_missing
      - permissions_denied
      - target_not_found
    example_input:
      target_id: "1234"
      delegated_user_context:
        principal_id: user-1
        email: user.one@example.com
    example_output:
      granted: true
      effective_identity_mode: delegated
      reason: granted

  - tool_name: get_content_by_id
    purpose: Retrieve normalised page body and metadata by Confluence content ID.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      required:
        - target_id
        - identity_mode
      properties:
        target_id:
          type: string
        identity_mode:
          enum:
            - app_only
            - delegated
        include_discussion_context:
          type: boolean
    output_schema:
      type: object
      required:
        - provider
        - target_id
        - canonical_url
        - title
        - content
        - metadata
      properties:
        provider:
          const: confluence
        target_id:
          type: string
        canonical_url:
          type: string
        title:
          type: string
        content:
          type: string
        metadata:
          type: object
        owner:
          type: object
        last_editor:
          type: object
        comments:
          type: array
    failure_modes:
      - target_not_found
      - permissions_denied
      - provider_timeout
    example_input:
      target_id: "1234"
      identity_mode: app_only
      include_discussion_context: true
    example_output:
      provider: confluence
      target_id: "1234"
      canonical_url: https://example.atlassian.net/wiki/spaces/SEC/pages/1234/Page+Title
      title: Page Title
      content: Example Confluence page content
      metadata: {}
      owner: {}
      last_editor: {}
      comments: []

  - tool_name: get_recent_mentions
    purpose: Poll for recent Confluence @mention events using the CQL mention operator, keyed by service account ID.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      properties:
        since:
          type: string
          description: ISO 8601 datetime watermark. Return only mentions created at or after this time.
        lookback_window:
          type: string
          description: ISO 8601 duration fallback (e.g. PT1H) used when since is absent. Deprecated; prefer since.
        scope_filter:
          type: object
          properties:
            space_key:
              type: string
              description: Single space key allowlist shorthand.
            space_keys:
              type: array
              items:
                type: string
              description: Space key allowlist. Use to restrict polling to approved spaces only.
    output_schema:
      type: object
      required:
        - mentions
      properties:
        mentions:
          type: array
          items:
            type: object
            required:
              - event_id
              - target_id
              - trigger_type
            properties:
              event_id:
                type: string
                description: Stable deduplication ID derived from space_key:page_id:content_id.
              content_id:
                type: string
              content_type:
                type: string
                enum: [page, comment]
              title:
                type: string
                description: Mentioned page title when available.
              target_id:
                type: string
                description: Page ID containing the mention.
              target_url:
                type: string
              space_key:
                type: string
              mentioner_account_id:
                type: string
              occurred_at:
                type: string
                description: ISO 8601 timestamp of the mention. Use as next watermark value.
              trigger_text:
                type: string
                description: Best-effort plain-text excerpt around the mention, used for framework intent parsing.
              trigger_type:
                type: string
                enum: [mention]
    failure_modes:
      - mentions_not_supported
      - provider_timeout
      - permissions_denied
    notes: >
      Requires the service account to be registered as a Confluence user (with a display name
      users can find in the @mention picker) and CONFLUENCE_ACCOUNT_ID to be configured with
      the service account's Atlassian account ID. Mention text matching supports configurable
      aliases via CONFLUENCE_MENTION_ALIASES (defaults include "@assessment-agent" and
      "@compliance-agent"). If account_id is unavailable, the tool falls back to alias text
      matching, which is less reliable than account-id matching.
    example_input:
      since: "2026-04-04T10:00:00Z"
      scope_filter:
        space_keys: [SEC]
    example_output:
      mentions:
        - event_id: "SEC:1234:comment-99"
          content_id: "comment-99"
          content_type: comment
          title: "Page Title"
          target_id: "1234"
          target_url: "https://example.atlassian.net/wiki/spaces/SEC/pages/1234"
          space_key: SEC
          mentioner_account_id: "5b109f2e-1234-abcd-5678-111111111111"
          occurred_at: "2026-04-04T10:05:00.000Z"
          trigger_text: "@compliance-agent please assess this page against Essential Eight"
          trigger_type: mention

  - tool_name: get_flagged_item_context
    purpose: Retrieve page content plus mention and comment context for a directed assessment request.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      required:
        - target_id
        - identity_mode
      properties:
        target_id:
          type: string
        identity_mode:
          enum:
            - app_only
            - delegated
        trigger_context:
          type: object
    output_schema:
      type: object
      required:
        - content_package
        - trigger_context
      properties:
        content_package:
          type: object
        trigger_context:
          type: object
    failure_modes:
      - target_not_found
      - permissions_denied
      - trigger_context_unavailable
    example_input:
      target_id: "1234"
      identity_mode: app_only
      trigger_context:
        event_id: evt-1
        trigger_type: mention
    example_output:
      content_package:
        provider: confluence
        target_id: "1234"
      trigger_context:
        event_id: evt-1
        trigger_type: mention

  - tool_name: resolve_page_owner
    purpose: Resolve the owner or responsible principal for a Confluence page.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      required:
        - target_id
      properties:
        target_id:
          type: string
    output_schema:
      type: object
      required:
        - principal_id
        - email
        - display_name
      properties:
        principal_id:
          type: string
        email:
          type: string
        display_name:
          type: string
    failure_modes:
      - owner_not_resolvable
      - target_not_found
    example_input:
      target_id: "1234"
    example_output:
      principal_id: owner-1
      email: owner@example.com
      display_name: Owner User

  - tool_name: resolve_last_editor
    purpose: Resolve the last editor of a Confluence page.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      required:
        - target_id
      properties:
        target_id:
          type: string
    output_schema:
      type: object
      required:
        - principal_id
        - email
        - display_name
        - modified_at
      properties:
        principal_id:
          type: string
        email:
          type: string
        display_name:
          type: string
        modified_at:
          type: string
    failure_modes:
      - editor_not_resolvable
      - target_not_found
    example_input:
      target_id: "1234"
    example_output:
      principal_id: editor-1
      email: editor@example.com
      display_name: Editor User
      modified_at: "2026-04-02T00:00:00Z"

  - tool_name: post_comment
    purpose: Publish an assessment comment on a Confluence page.
    allowed_identity_modes:
      - app_only
      - delegated
    input_schema:
      type: object
      required:
        - target_id
        - comment_body
        - identity_mode
        - idempotency_key
      properties:
        target_id:
          type: string
        comment_body:
          type: string
        identity_mode:
          enum:
            - app_only
            - delegated
        idempotency_key:
          type: string
    output_schema:
      type: object
      required:
        - success
        - comment_id
        - canonical_url
      properties:
        success:
          type: boolean
        comment_id:
          type: string
        canonical_url:
          type: string
    failure_modes:
      - permissions_denied
      - duplicate_submission
      - provider_timeout
    example_input:
      target_id: "1234"
      comment_body: Assessment completed.
      identity_mode: app_only
      idempotency_key: idem-1
    example_output:
      success: true
      comment_id: cmt-1
      canonical_url: https://example.atlassian.net/wiki/spaces/SEC/pages/1234/Page+Title#comment-cmt-1
