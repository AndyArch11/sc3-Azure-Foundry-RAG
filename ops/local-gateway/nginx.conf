worker_processes 1;

events {
      worker_connections 1024;
}

http {
      lua_package_path "/usr/local/openresty/lualib/?.lua;;";
      client_max_body_size 10m;

      server {
            listen 8081;

            location = /gateway/health {
                  default_type application/json;
                  return 200 '{"status":"ok"}';
            }

            location = /health {
                  proxy_pass http://query-web:8080/health;
            }

            location = /openapi/v1/rag-api-v1.openapi.yaml {
                  default_type application/yaml;
                  alias /etc/rag/contracts/rag-api-v1.openapi.yaml;
                  add_header Cache-Control "no-store";
            }

            location = /api/v1/ask {
                  # Allow long-running RAG requests to complete without the default 60s proxy timeout.
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
                  send_timeout 300s;

                  content_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        ngx.req.read_body()
                        local cjson = require("cjson.safe")
                        local payload = {}
                        local body = ngx.req.get_body_data()

                        if body and body ~= "" then
                              local decoded, decode_err = cjson.decode(body)
                              if decode_err then
                                    ngx.status = ngx.HTTP_BAD_REQUEST
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"invalid_json"}')
                                    return ngx.exit(ngx.HTTP_BAD_REQUEST)
                              end
                              if type(decoded) == "table" then
                                    payload = decoded
                              end
                        end

                        payload.auth_token = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""

                        local new_body = cjson.encode(payload) or "{}"
                        ngx.req.set_body_data(new_body)
                        ngx.req.set_header("Content-Type", "application/json")
                        ngx.req.set_header("Content-Length", #new_body)
                        ngx.req.set_uri("/api/ask", false)

                        return ngx.exec("@ask_backend")
                  }
            }

            location = /api/v1/graph/query {
                  # Mirror APIM MCP routing: validate the edge bearer token, inject
                  # the private query-web token, and forward the bounded query.
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;

                  content_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        ngx.req.read_body()
                        local cjson = require("cjson.safe")
                        local payload = {}
                        local body = ngx.req.get_body_data()
                        if body and body ~= "" then
                              local decoded, decode_err = cjson.decode(body)
                              if decode_err or type(decoded) ~= "table" then
                                    ngx.status = ngx.HTTP_BAD_REQUEST
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"invalid_json"}')
                                    return ngx.exit(ngx.HTTP_BAD_REQUEST)
                              end
                              payload = decoded
                        end

                        payload.auth_token = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        local new_body = cjson.encode(payload) or "{}"
                        ngx.req.set_body_data(new_body)
                        ngx.req.set_header("Content-Type", "application/json")
                        ngx.req.set_header("Content-Length", #new_body)
                        ngx.req.set_uri("/api/graph/query", false)
                        return ngx.exec("@graph_query_backend")
                  }
            }

            location @graph_query_backend {
                  proxy_pass http://query-web:8080;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/v1/graph/status {
                  access_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        local args = ngx.req.get_uri_args()
                        args["auth_token"] = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        ngx.req.set_uri_args(args)
                        ngx.req.set_uri("/api/graph/status", false)
                  }
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/v1/provider-status {
                  access_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        local args = ngx.req.get_uri_args()
                        args["auth_token"] = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        ngx.req.set_uri_args(args)
                        ngx.req.set_uri("/api/provider-status", false)
                  }
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/v1/graph/related {
                  access_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        local args = ngx.req.get_uri_args()
                        args["auth_token"] = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        ngx.req.set_uri_args(args)
                        ngx.req.set_uri("/api/graph/related", false)
                  }
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location = /api/v1/graph/export {
                  access_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        local args = ngx.req.get_uri_args()
                        args["auth_token"] = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        ngx.req.set_uri_args(args)
                        ngx.req.set_uri("/api/graph/export", false)
                  }
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location ~ ^/api/v1/graph/nodes/[^/]+$ {
                  access_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        local args = ngx.req.get_uri_args()
                        args["auth_token"] = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        ngx.req.set_uri_args(args)
                        ngx.req.set_uri(ngx.re.gsub(ngx.var.uri, "^/api/v1/graph/nodes", "/api/graph/nodes"), false)
                  }
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location ~ ^/api/v1/frameworks/[^/]+/controls$ {
                  access_by_lua_block {
                        local expected_bearer = os.getenv("GATEWAY_BEARER_TOKEN") or ""
                        if expected_bearer ~= "" then
                              local auth_header = ngx.req.get_headers()["authorization"] or ""
                              local supplied_bearer = auth_header:match("^[Bb]earer%s+(.+)$") or ""
                              if supplied_bearer ~= expected_bearer then
                                    ngx.status = ngx.HTTP_UNAUTHORIZED
                                    ngx.header["Content-Type"] = "application/json"
                                    ngx.say('{"error":"unauthorized"}')
                                    return ngx.exit(ngx.HTTP_UNAUTHORIZED)
                              end
                        end

                        local args = ngx.req.get_uri_args()
                        args["auth_token"] = os.getenv("QUERY_WEB_AUTH_TOKEN") or ""
                        ngx.req.set_uri_args(args)
                        ngx.req.set_uri(ngx.re.gsub(ngx.var.uri, "^/api/v1/frameworks", "/api/frameworks"), false)
                  }
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 120s;
                  proxy_read_timeout 120s;
                  send_timeout 120s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

            location @ask_backend {
                  proxy_pass http://query-web:8080;
                  proxy_connect_timeout 10s;
                  proxy_send_timeout 300s;
                  proxy_read_timeout 300s;
                  send_timeout 300s;
                  proxy_set_header Host $host;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
            }

      }
}
