auth_enabled: false

server:
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  # TODO: Loki 3.x still emits JSONParserErr / "Value looks like object, but can't find
  # closing '}' symbol" on plain Uvicorn access lines (e.g. GET /metrics HTTP/1.1 200 OK)
  # despite discover_log_levels and allow_structured_metadata being disabled.
  # The error appears in __error__ structured metadata on ingested log entries.
  # Investigate whether a Promtail pipeline drop stage filtering non-JSON lines
  # before push, or a Loki per-stream structured-metadata override, is the correct fix.
  discover_log_levels: false
  allow_structured_metadata: false

analytics:
  reporting_enabled: false