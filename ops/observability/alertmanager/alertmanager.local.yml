global:
  resolve_timeout: 5m

# Top-level route — all alerts fall through here unless a child route matches.
route:
  receiver: webhook-echo
  group_by: [alertname, severity]
  group_wait: 10s
  group_interval: 1m
  repeat_interval: 15m
  routes:
    # Critical alerts get a shorter repeat so they stay visible.
    - matchers:
        - severity="critical"
      receiver: webhook-echo
      group_wait: 5s
      repeat_interval: 5m

receivers:
  - name: webhook-echo
    webhook_configs:
      - url: http://webhook-echo:8080/alert
        send_resolved: true

# Silence any alerts generated by the alertmanager itself (inhibit loop noise).
inhibit_rules:
  - source_matchers:
      - severity="critical"
    target_matchers:
      - severity="warning"
    equal: [alertname]
