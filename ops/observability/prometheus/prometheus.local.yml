global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/alerts.local.yml

scrape_configs:
  - job_name: query-web
    metrics_path: /metrics
    static_configs:
      - targets:
          - query-web:8080
