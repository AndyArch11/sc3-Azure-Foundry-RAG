groups:
  - name: query-web-latency
    rules:
      - alert: QueryWebHighP95Latency
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 1
        for: 10m
        labels:
          severity: warning
          service: query-web
        annotations:
          summary: Query web p95 latency is elevated
          description: p95 latency is above 1 second for 10 minutes.

      - alert: QueryWebHighP99Latency
        expr: histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: critical
          service: query-web
        annotations:
          summary: Query web p99 latency is elevated
          description: p99 latency is above 2 seconds for 10 minutes.

  - name: query-web-trace-hygiene
    rules:
      - alert: QueryWebTraceparentDropSpike
        expr: sum(rate(trace_traceparent_dropped_total[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
          service: query-web
        annotations:
          summary: Traceparent drop rate is elevated
          description: Dropped traceparent headers are above 0.1 per second for 5 minutes.

      - alert: QueryWebCorrelationIdSanitisationSpike
        expr: rate(trace_correlation_id_sanitised_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          service: query-web
        annotations:
          summary: Correlation ID sanitisation rate is elevated
          description: Sanitised correlation IDs are above 0.05 per second for 5 minutes.

  - name: query-web-scrape-health
    rules:
      - alert: QueryWebTargetDown
        expr: up{job="query-web"} == 0
        for: 2m
        labels:
          severity: critical
          service: query-web
        annotations:
          summary: Query web metrics target is down
          description: Prometheus cannot scrape the query-web target for more than 2 minutes.

      - alert: QueryWebNoTraffic
        expr: sum(increase(http_request_duration_seconds_count{path!="/metrics"}[10m])) == 0
        for: 10m
        labels:
          severity: warning
          service: query-web
        annotations:
          summary: Query web has no inbound traffic
          description: No non-metrics HTTP requests were observed for 10 minutes while scrape remains healthy.
