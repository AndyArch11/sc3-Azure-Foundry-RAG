name: Local Profile CI

on:
  pull_request:
    paths:
      - query_web/**
      - runtime/**
      - ops/scripts/**
      - tests/**
      - .env.local.example
      - docker-compose.local.yml
      - requirements-dev.txt
      - .github/workflows/local-profile.yml
  push:
    branches:
      - main
    paths:
      - query_web/**
      - runtime/**
      - ops/scripts/**
      - tests/**
      - .env.local.example
      - docker-compose.local.yml
      - requirements-dev.txt
      - .github/workflows/local-profile.yml

permissions:
  contents: read

jobs:
  local-profile-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CLOUD_PROVIDER: local
      LOCAL_VECTOR_BACKEND: inmemory
      PRECEDENCE_POLICY_PATH: ./query_web/policies/precedence_policy.json
      OLLAMA_MODEL: gemma3:27b
      OLLAMA_EMBEDDING_MODEL: nomic-embed-text
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Validate local env template exists
        run: test -f .env.local.example

      - name: Run Docker profile smoke checks
        run: |
          bash ./ops/scripts/local/smoke-docker-profiles.sh

      - name: Report Docker image sizes
        run: |
          docker image inspect \
            runtime-profile-smoke-local \
            poller-profile-smoke-local \
            queryweb-full-profile-smoke-local \
            queryweb-cloud-profile-smoke-local \
            --format 'image={{index .RepoTags 0}} size_bytes={{.Size}}'

      - name: Run isort check
        run: |
          python -m isort --check query_web runtime/assessment_orchestration runtime/ingestion tests

      - name: Run black check
        run: |
          python -m black --check query_web runtime/assessment_orchestration runtime/ingestion tests

      - name: Run pylint
        run: |
          python -m pylint --errors-only \
            query_web/endpoints/ask.py \
            query_web/endpoints/home.py \
            query_web/local_startup.py \
            runtime/credentials \
            runtime/llm \
            runtime/search \
            runtime/storage \
            tests/unit/test_credentials_factory.py \
            tests/unit/test_search_abstraction.py \
            tests/unit/test_storage_abstraction.py \
            tests/unit/test_llm_adapters.py \
            tests/unit/test_query_web_local_startup.py \
            tests/unit/test_query_web_ask_module.py \
            tests/unit/test_query_web_home_module.py

      - name: Run mypy
        run: |
          python -m mypy \
            query_web/endpoints/ask.py \
            query_web/endpoints/home.py \
            query_web/local_startup.py \
            runtime/credentials \
            runtime/llm \
            runtime/search \
            runtime/storage \
            --ignore-missing-imports

      - name: Run local profile unit tests with coverage gate
        run: |
          pytest -q \
            tests/unit/test_credentials_factory.py \
            tests/unit/test_search_abstraction.py \
            tests/unit/test_storage_abstraction.py \
            tests/unit/test_llm_adapters.py \
            tests/unit/test_query_web_local_startup.py \
            tests/unit/test_query_web_ask_module.py \
            tests/unit/test_query_web_home_module.py \
            --cov=runtime/credentials \
            --cov=runtime/search \
            --cov=runtime/storage \
            --cov=runtime/llm \
            --cov=query_web.local_startup \
            --cov=query_web.endpoints.ask \
            --cov=query_web.endpoints.home \
            --cov-report=term-missing \
            --cov-fail-under=70
