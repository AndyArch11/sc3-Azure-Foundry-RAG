services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  model-puller:
    image: ollama/ollama:latest
    container_name: rag-model-puller
    restart: "no"
    env_file:
      - .env.local
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c",
      "ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} && ollama pull ${OLLAMA_MODEL:-llama3.2}"]

  seeder:
    build:
      context: .
      dockerfile: query_web/Dockerfile
    container_name: rag-seeder
    restart: "no"
    env_file:
      - .env.local
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_EVIDENCE_JSONL_PATH: /app/runtime/out/chunks.jsonl
      LOCAL_CONTROLS_JSONL_PATH: /app/parsed-controls
    depends_on:
      qdrant:
        condition: service_started
      model-puller:
        condition: service_completed_successfully
    volumes:
      - ./runtime/out:/app/runtime/out:ro
      - ./parsed-controls:/app/parsed-controls:ro
      - ./ops/scripts/seed_local.py:/app/seed_local.py:ro
    command: ["python", "/app/seed_local.py"]

  query-web:
    build:
      context: .
      dockerfile: query_web/Dockerfile
    container_name: rag-query-web-local
    restart: unless-stopped
    ports:
      - "8080:8080"
    env_file:
      - .env.local
    environment:
      CLOUD_PROVIDER: local
      LOCAL_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_EVIDENCE_JSONL_PATH: /app/runtime/out/chunks.jsonl
      LOCAL_CONTROLS_JSONL_PATH: /app/parsed-controls
    depends_on:
      seeder:
        condition: service_completed_successfully
    volumes:
      - ./runtime/out:/app/runtime/out:ro
      - ./parsed-controls:/app/parsed-controls:ro

volumes:
  ollama_data:
  qdrant_data:
