services:
  local-data-init:
    build:
      context: .
      dockerfile: query_web/Dockerfile.local
    container_name: rag-local-data-init
    user: "0"
    restart: "no"
    command:
      - /bin/sh
      - -lc
      - |
        set -e
        mkdir -p /seed/runtime/out /seed/parsed-controls

        if [ ! -s /seed/runtime/out/chunks.jsonl ]; then
          : > /seed/runtime/out/chunks.jsonl
          echo "Created empty runtime chunks.jsonl for manual Corpus C uploads"
        else
          echo "Runtime chunks already present in named volume"
        fi

        if [ -z "$(ls -A /seed/parsed-controls 2>/dev/null)" ]; then
          cp -R /app/parsed-controls/. /seed/parsed-controls/
          echo "Seeded parsed controls into named volume"
        else
          # parsed-controls is baked-in reference data (unlike runtime/out, which
          # holds user-uploaded Corpus C content) — always resync so framework
          # updates (e.g. a newer ISM catalog) aren't stuck behind a stale volume.
          find /seed/parsed-controls -mindepth 1 -delete
          cp -R /app/parsed-controls/. /seed/parsed-controls/
          echo "Refreshed parsed controls in named volume from current image"
        fi

        chown -R 1000:1000 /seed/parsed-controls /seed/runtime/out
    volumes:
      - local_runtime_out:/seed/runtime/out
      - local_parsed_controls:/seed/parsed-controls

  qdrant:
    image: qdrant/qdrant:latest
    container_name: rag-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    pull_policy: always
    container_name: rag-ollama
    restart: unless-stopped
    gpus: all
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  model-puller:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    pull_policy: always
    container_name: rag-model-puller
    restart: "no"
    env_file:
      - .env.local
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      - ollama
    entrypoint: ["/bin/sh", "-c",
      "ollama pull ${OLLAMA_EMBEDDING_MODEL:-nomic-embed-text} && ollama pull ${OLLAMA_MODEL:-llama3.2}"]

  seeder:
    build:
      context: .
      dockerfile: query_web/Dockerfile.local
    container_name: rag-seeder
    restart: "no"
    env_file:
      - .env.local
    environment:
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_EVIDENCE_JSONL_PATH: /app/runtime/out/chunks.jsonl
      LOCAL_CONTROLS_JSONL_PATH: /app/parsed-controls
      SEED_STATE_DIR: /app/local_state
    depends_on:
      qdrant:
        condition: service_started
      model-puller:
        condition: service_completed_successfully
      local-data-init:
        condition: service_completed_successfully
    volumes:
      - local_runtime_out:/app/runtime/out:ro
      - local_parsed_controls:/app/parsed-controls:ro
      - local_state:/app/local_state
    command: ["python", "/app/local/seed_local.py"]

  query-web:
    build:
      context: .
      dockerfile: query_web/Dockerfile.local
    container_name: rag-query-web-local
    restart: unless-stopped
    ports:
      - "18080:8080"
    env_file:
      - .env.local
    environment:
      CLOUD_PROVIDER: local
      LOCAL_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_EVIDENCE_JSONL_PATH: /app/runtime/out/chunks.jsonl
      LOCAL_CONTROLS_JSONL_PATH: /app/parsed-controls
      LOCAL_STATE_DB_PATH: /app/local_state/state.db
    depends_on:
      seeder:
        condition: service_completed_successfully
    volumes:
      - local_runtime_out:/app/runtime/out
      - local_parsed_controls:/app/parsed-controls
      - local_state:/app/local_state

  rag-gateway-local:
    build:
      context: .
      dockerfile: ops/local-gateway/Dockerfile
    container_name: rag-gateway-local
    restart: unless-stopped
    profiles: ["gateway"]
    ports:
      - "${RAG_GATEWAY_HOST_PORT:-18081}:8081"
    environment:
      QUERY_WEB_AUTH_TOKEN: ${QUERY_WEB_AUTH_TOKEN:-}
      GATEWAY_BEARER_TOKEN: ${GATEWAY_BEARER_TOKEN:-}
    depends_on:
      query-web:
        condition: service_started

  confluence-poller:
    profiles: ["confluence-poller"]
    build:
      context: .
      dockerfile: runtime/Dockerfile.poller.local
    container_name: rag-confluence-poller-local
    restart: unless-stopped
    env_file:
      - .env.local
    environment:
      CLOUD_PROVIDER: local
      LOCAL_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
      OLLAMA_BASE_URL: http://ollama:11434
      LOCAL_EVIDENCE_JSONL_PATH: /app/runtime/out/chunks.jsonl
      LOCAL_CONTROLS_JSONL_PATH: /app/parsed-controls
      PRECEDENCE_POLICY_PATH: /app/query_web/policies/precedence_policy.json
      LOCAL_STATE_DB_PATH: /app/local_state/state.db
    depends_on:
      seeder:
        condition: service_completed_successfully
    command: []
    volumes:
      - local_runtime_out:/app/runtime/out:ro
      - local_parsed_controls:/app/parsed-controls:ro
      - local_state:/app/local_state

volumes:
  ollama_data:
  qdrant_data:
  local_state:
  local_runtime_out:
  local_parsed_controls:
